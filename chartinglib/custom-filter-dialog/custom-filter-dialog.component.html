<div mat-dialog-content class="filter-dialog-content">
    @if (showTimeDurationFilter) {
      <p-dropdown [options]="timePeriodOptions" placeholder="Select Time Duration"
        [editable]="false" (onChange)="onTimeDurationChange($event)" [showClear]="true"></p-dropdown>
    }
    
    @if (enableCustomTime) {
      <p-calendar [(ngModel)]="dateRange" selectionMode="range" [showTime]="true"
        (onClose)="onCustomTimeSelected()" [appendTo]="'body'">
      </p-calendar>
    }
    
    @if (showTimeFilter || disableTimeFilter) {
      <p-dropdown [options]="timeFilter" [(ngModel)]="timeFilterValue"
        placeholder="Select Time" [editable]="false" (onChange)="onTimeChange($event)" [appendTo]="'body'">
      </p-dropdown>
    }
  
    @if (showRefreshInterval || refreshIntervalValue) {
      <p-dropdown [options]="refreshInterval" [(ngModel)]="refreshIntervalValue"
        placeholder="Select Interval Time" optionLabel="displayName" optionValue="returnValue"
        (onChange)="setIntervalTime($event)" [appendTo]="'body'">
      </p-dropdown>
    }
  
    @if (showEntity) {
      <p-dropdown [options]="customFilterKeys" [(ngModel)]="selectedCustomFilterkey" placeholder="Select an Entity"
        [editable]="false" (onChange)="onCustomFilterKeyChange($event)" [appendTo]="'body'">
      </p-dropdown>
    }
  
    @if (showEntity && selectedCustomFilterkey) {
      <p-multiSelect [options]="customFilters[selectedCustomFilterkey]"
        [(ngModel)]="selectedFilterValues"
        optionLabel="displayName" optionValue="returnValue"
        placeholder="Select {{ selectedCustomFilterkey }}"
        [showClear]="true"
        (onChange)="onCustomFilterValuesChange($event)"
        [appendTo]="'body'">
      </p-multiSelect>
    }
</div>
