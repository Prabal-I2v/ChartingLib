<div class="widget-wrapper">
  <div class="widget-content">
    <div class="header-section">
      @if (!isModel) {
        <div class="data-container no-data-background">
          <div class="noConfExist">
            <div class="logo-container large flex-row-center-center i2v-btn-icon tertiary-default" libSvgElement
              [appSvg]="'assets/Outline/table.svg'" [size]="'48'" [fill-color]="'white'"></div>
            <span class="major-heading">No Configurations found</span>
          </div>
        </div>
      }
      @if (isModel) {
        <i2v-chart-header class="chart-header" [(showFilterValues)]="showFilterValues"
          (widgetResizeEmittor)="widgetResizeCallback($event)" [widgetModel]="widgetRequestModel"
          [customFilters]="customFilters" [isEditModeOn]="isEditModeOn" (daysFilterOutput)="onTimeChange($event)"
          (customFilterOutput)="onCustomFilterValuesChange($event)"
          (refreshIntervalFilterOutput)="onRefreshIntervalChange($event)"
          (clearCustomFiltersValues)="clearCustomFiltersValues($event)"
          (combineFilterOutputEmittor)="onCombineFilterOutputEmittor($event)"
          (timePeriodOutput)="onTimeDurationChanged($event)" [applyToAllEnabled]="applyToAllEnabled"
          [showEntity]="showEntity" [showTimeFilter]="showTimeFilter"
          [showRefreshInterval]="showRefreshInterval">
        </i2v-chart-header>
      }
    </div>
    @if (isModel && isLoading) {
      <div class="loading-container">
        <span class="loading-spinner"></span>
      </div>
    }
    @if (isModel && !isLoading && !dataExists) {
      <div class="data-container">
        <div class="noConfExist">
          <div class="logo-container large flex-row-center-center i2v-btn-icon tertiary-default" libSvgElement
            [appSvg]="'assets/Outline/table.svg'" [size]="'48'" [fill-color]="'white'"></div>
          <span class="major-heading">No Data found</span>
        </div>
      </div>
    }
    @if (isModel && !isLoading && dataExists) {
      <kendo-chart class="chart-container"
        [ngStyle]="{'min-height': showFilterValues ? '400px' : '0px'}"
        [pannable]="widgetRequestModel.widgetInteractivityConfig.isPannable ? { lock: 'x' } : false" 
        [zoomable]="widgetRequestModel.widgetInteractivityConfig.isZoomable ? { mousewheel: { lock: 'x' } } : false">
        <kendo-chart-x-axis>
          <kendo-chart-x-axis-item [labels]="{ rotation: 'auto' }" [line]="{ visible: false }"> </kendo-chart-x-axis-item>
        </kendo-chart-x-axis>

        <kendo-chart-y-axis>
          <kendo-chart-y-axis-item [labels]="{ rotation: 'auto' }" [line]="{ visible: false }"> </kendo-chart-y-axis-item>
        </kendo-chart-y-axis>
        <kendo-chart-series>
          <kendo-chart-series-item type="heatmap" [data]="chartData.data" xField="xAxis" yField="yAxis"
            valueField="value">
            <kendo-chart-series-item-markers [type]="'roundedRect'">
            </kendo-chart-series-item-markers>
            <kendo-chart-series-item-labels [visible]="true">
            </kendo-chart-series-item-labels>
          </kendo-chart-series-item>
        </kendo-chart-series>
      </kendo-chart>
    }
  </div>
  @if (showFilterValues && !isEditModeOn) {
    <div class="filter-details-section">
      <app-details-widget [commonWidgetCustomFilter]="widgetRequestModel.filterConfig.customFilters">
      </app-details-widget>
    </div>
  }
</div>
