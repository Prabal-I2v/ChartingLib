<div [ngStyle]="{ background:widgetRequestModel?.widgetInteractivityConfig.isWidgetHidden ? 'rgba(0, 0, 0, 0.1)' : '#fff' }" class="widget-wrapper">
  <div class="widget-content">
    <div class="header-section">
      @if (!isModel) {
        <div class="data-container no-data-background">
          <div class="noConfExist">
            <div class="logo-container large flex-row-center-center i2v-btn-icon tertiary-default" libSvgElement
              [appSvg]="'assets/Outline/table.svg'" [size]="'48'" [fill-color]="'white'"></div>
            <span class="major-heading">No Configurations found</span>
          </div>
        </div>
      }
      @if (isModel) {
        <i2v-chart-header class="chart-header" [(showFilterValues)]="showFilterValues" [widgetModel]="widgetRequestModel"
          [customFilters]="customFilters" [isEditModeOn]="isEditModeOn" (daysFilterOutput)="onTimeChange($event)" 
          (widgetResizeEmittor)="widgetResizeCallback($event)" (customFilterOutput)="onCustomFilterValuesChange($event)"
          (refreshIntervalFilterOutput)="onRefreshIntervalChange($event)" (clearCustomFiltersValues)="clearCustomFiltersValues($event)"
          (combineFilterOutputEmittor)="onCombineFilterOutputEmittor($event)" (timePeriodOutput)="onTimeDurationChanged($event)" 
          [applyToAllEnabled]="applyToAllEnabled" [showEntity]="showEntity" [showTimeFilter]="showTimeFilter" 
          [showRefreshInterval]="showRefreshInterval">
        </i2v-chart-header>
      }
    </div>
    @if (isModel && isLoading) {
      <div class="loading-container">
        <span class="loading-spinner"></span>
      </div>
    }
    @if (isModel && !isLoading && !dataExists) {
      <div class="data-container">
        <div class="noConfExist">
          <div class="logo-container large flex-row-center-center i2v-btn-icon tertiary-default" libSvgElement
            [appSvg]="'assets/Outline/table.svg'" [size]="'48'" [fill-color]="'white'"></div>
          <span class="major-heading">No Data found</span>
        </div>
      </div>
    }

    @if (isModel && !isLoading && dataExists) {
      <kendo-chart [chartArea]="{ background: 'transparent' }" class="chart-container" 
        [ngStyle]="{'min-height': showFilterValues ? '400px' : '0px'}">
        <kendo-chart-legend position="top" orientation="horizontal" [spacing]="140" 
          [padding]="{ left: 80, right: 80 }"></kendo-chart-legend>
        <kendo-chart-tooltip>
          <ng-template kendoChartSeriesTooltipTemplate let-value="value" let-category="category">
            {{ value }}
          </ng-template>
        </kendo-chart-tooltip>
        <kendo-chart-series>
          <kendo-chart-series-item type="pie" [data]="chartData.series" field="value" categoryField="name"
            [autoFit]="true" [labels]="{ visible: true, content: labelContent }">
          </kendo-chart-series-item>
        </kendo-chart-series>
      </kendo-chart>
    }
  </div>
  @if (showFilterValues && !isEditModeOn) {
    <div class="filter-details-section">
      <app-details-widget [commonWidgetCustomFilter]="widgetRequestModel.filterConfig.customFilters">
      </app-details-widget>
    </div>
  }
</div>
