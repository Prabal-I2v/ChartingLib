<div style="
    display: flex;
    gap: 10px;
    width: 100%;
    justify-content: space-between;
    align-items: center;
  ">
  <div style="
      display: flex;
      width: 40%;
      align-self: start;
      gap: 5px;
      align-items: center;
      flex: 1;
    ">
    <div *ngIf="svgIcon" class="icon-box" style="align-self: start;">
      <span libSvgElement [appSvg]="svgIcon" [size]="'20'" [fill-color]="'#5F6F94'"></span>
    </div>
    <div style="
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 5px;
        min-width: 0; /* This is crucial */
        overflow: hidden; /* Ensures content doesn't overflow */
      ">
      <span style="
          margin: 0;
          overflow: hidden;
          white-space: nowrap;
          text-overflow: ellipsis;
          font-size: 18px;
          width: 100%; /* Makes it take full width of parent */
        " [title]="heading" *ngIf="heading">
        {{ heading }}
      </span>
      <span style="
        margin: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font-size: 14px;
        width: 100%; /* Makes it take full width of parent */
      " [title]="subHeading" *ngIf="subHeading">({{ subHeading }})</span>
    </div>
  </div>

  <div *ngIf="customFilters && isEditModeOn" style="
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
      align-self: start;
    " [ngStyle]="{'display' : showFilter ? 'flex' : 'none'}">
    <button class="flex-row-center-center i2v-btn-icon tertiary-default" style="position: relative;" libSvgElement
      [appSvg]="'assets/Outline/filter-off.svg'" [size]="'20'" (click)="toggleShowFilter()">
    </button>
    <p-calendar *ngIf="enableCustomTime" [(ngModel)]="dateRange" selectionMode="range" [showTime]="true"
      #customTimeFilterRef (onClose)="onCustomTimeSelected()" [appendTo]="'body'">
    </p-calendar>
    <p-dropdown *ngIf="!disableTimeFilter" [options]="timeFilter" [(ngModel)]="timeFilterValue"
      placeholder="Select Time" [editable]="false" (onChange)="onTimeChange($event)" [appendTo]="'body'">
    </p-dropdown>
    <span>
      <p-dropdown *ngIf="refreshIntervalValue" [options]="refreshInterval" [(ngModel)]="refreshIntervalValue"
        placeholder="Select Interval Time" optionLabel="displayName" #refreshIntervalRef optionValue="returnValue"
        (onChange)="setIntervalTime($event)" [appendTo]="'body'">
      </p-dropdown>
    </span>
    <p-dropdown [options]="customFilterKeys" [(ngModel)]="selectedCustomFilterkey" placeholder="Select an Entity"
      [editable]="false" #keySelectRef (onChange)="onCustomFilterKeyChange($event)" [appendTo]="'body'">
    </p-dropdown>
    <p-multiSelect *ngIf="selectedCustomFilterkey" [options]="customFilters[selectedCustomFilterkey]"
      optionLabel="displayName" optionValue="returnValue" #multiselectRef
      placeholder="Select {{ selectedCustomFilterkey }}" [showClear]="true"
      (onClear)="onCustomFilterValuesChange($event)" (onChange)="onCustomFilterValuesChange($event)"
      [appendTo]="'body'">
    </p-multiSelect>
  </div>
  <div *ngIf="!showFilter && customFilters && isEditModeOn" style="
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;">
    <button class="flex-row-center-center i2v-btn-icon tertiary-default" style="position: relative;" libSvgElement
      [appSvg]="'assets/Outline/filter.svg'" [size]="'20'" (click)="toggleShowFilter()">
    </button>
  </div>
  <div *ngIf="!widgetModel.isDashboardFilterApplied && !isEditModeOn" style="
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
">
    <button class="flex-row-center-center i2v-btn-icon tertiary-default" style="position: relative;" libSvgElement
      [appSvg]="showFilterValues ? 'assets/Outline/eye.svg' : 'assets/Outline/eye-off.svg'" [size]="'20'"
      (click)="toggleShowFilterValues()">
    </button>
    <span style="position: absolute; top: -12px; right: -5px;" class="filterSVG" libSvgElement
      [appSvg]="'assets/Solid/status.svg'" [size]="'8'" [fill-color]="'#0099ED'">
    </span>
  </div>
</div>
