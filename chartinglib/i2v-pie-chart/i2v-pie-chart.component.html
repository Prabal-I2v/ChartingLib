<div style="display: flex; flex-direction: column; width: 100%; height: 100%">
  <div style="display: flex; flex-direction: column; width: 100%; height: 100%; padding: 16px; overflow-x: auto">
    <div style=" display: flex; justify-items: center; align-items: center; gap: 10px; width: 100%;">
      <div *ngIf="!isModel" class="data-container" style="
        overflow-x: hidden;
        height: 100%;
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 10px 15px;
        background-color: #fff;
      ">
        <div class="noConfExist">
          <div class="logo-container large flex-row-center-center i2v-btn-icon tertiary-default" libSvgElement
            [appSvg]="'assets/Outline/table.svg'" [size]="'48'" [fill-color]="'white'"></div>
          <span class="major-heading">No Configurations found</span>
        </div>
      </div>
      <i2v-chart-header *ngIf="isModel" style="width: 100%; z-index : 10" [(showFilterValues)]="showFilterValue" [widgetModel]="widgetRequestModel"
        [customFilters]="customFilters" [isEditModeOn]="isEditModeOn" (daysFilterOutput)="onTimeChange($event)"
        (customFilterOutput)="onCustomFilterValuesChange($event)"
        (refreshIntervalFilterOutput)="onRefreshIntervalChange($event)"
        (combineFilterOutputEmittor)="onCombineFilterOutputEmittor($event)"></i2v-chart-header>
    </div>
    <ng-container *ngIf="isModel && isLoading">
      <div style="
        display: flex;
        width: 360px;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 20px;
        flex: 1;
        height: 100%;
        width: 100%;
      ">
        <span style="
          width: 50px;
          height: 50px;
          background: url(assets/gifs/horizontal-loader.gif) no-repeat center;
          background-size: 100% 100%;
        "></span>
      </div>
    </ng-container>
    <div *ngIf="isModel && !isLoading && !dataExists" class="data-container" style="
      overflow-x: hidden;
      height: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px 15px;
      background-color: #fff;
    ">
      <div class="noConfExist">
        <div class="logo-container large flex-row-center-center i2v-btn-icon tertiary-default" libSvgElement
          [appSvg]="'assets/Outline/table.svg'" [size]="'48'" [fill-color]="'white'"></div>
        <span class="major-heading">No Data found</span>
      </div>
    </div>

    <kendo-chart style="height: 100%" *ngIf="isModel && !isLoading && dataExists" [ngStyle]="{'min-height': showFilterValue ? '400px' : '0px'}">
      <kendo-chart-legend position="bottom" [visible]="true"></kendo-chart-legend>
      <kendo-chart-tooltip format="{0}"></kendo-chart-tooltip>
      <kendo-chart-series>
        <kendo-chart-series-item type="pie" [data]="chartData.series" field="value" categoryField="category"
          [autoFit]="true" [labels]="{ visible: true, content: labelContent }">
        </kendo-chart-series-item>
      </kendo-chart-series>
    </kendo-chart>
  </div>
  <div *ngIf="showFilterValue"  style="display: flex; padding : 10px; border-top: 1px solid rgb(188, 188, 188)">
    <app-details-widget [commonWidgetCustomFilter]="widgetRequestModel.customFilters">
    </app-details-widget>
  </div>
</div>
