<div [ngStyle]="{ background:widgetRequestModel?.isWidgetHidden ? 'rgba(0, 0, 0, 0.1)' : '#fff' }"
  style="display: flex; flex-direction: column; width: 100%; height: 100%; background: white;">
  <div
    style="display: flex; flex-direction: column; width: 100%; flex: 1; padding: 16px; gap: 10px; overflow-x: auto;">
    <div style=" display: flex; justify-items: center; align-items: center; gap: 10px; width: 100%;">
      <div *ngIf="!isModel" class="data-container" style="
          overflow-x: hidden;
          height: 100%;
          flex: 1;
          display: flex;
          flex-direction: column;
          padding: 10px 15px;
          background-color: #fff;
        ">
        <div class="noConfExist">
          <div class="logo-container large flex-row-center-center i2v-btn-icon tertiary-default" libSvgElement
            [appSvg]="'assets/Outline/table.svg'" [size]="'48'" [fill-color]="'white'"></div>
          <span class="major-heading">No Configurations found</span>
        </div>
      </div>
      <i2v-chart-header *ngIf="isModel" style="width: 100%;" [(showFilterValues)]="showFilterValues"
        (widgetResizeEmittor)="widgetResizeCallback($event)" [widgetModel]="widgetRequestModel"
        [customFilters]="customFilters" [isEditModeOn]="isEditModeOn" (daysFilterOutput)="onTimeChange($event)"
        (customFilterOutput)="onCustomFilterValuesChange($event)"
        (refreshIntervalFilterOutput)="onRefreshIntervalChange($event)"
        (clearCustomFiltersValues)="clearCustomFiltersValues($event)"
        (combineFilterOutputEmittor)="onCombineFilterOutputEmittor($event)"
        (timePeriodOutput)="onTimeDurationChanged($event)" [applyToAllEnabled]="applyToAllEnabled" [showEntity]="showEntity" [showTimeFilter]="showTimeFilter" [showRefreshInterval]="showRefreshInterval">
        <div *ngIf="columnDefs.length>0" style="display : flex; gap : 10px">
          <p-multiSelect class="column-multiselect" [(ngModel)]="selectedColumnDefs"
            [options]="SelectColumnFilteredList | async" optionLabel="headerName" placeholder="Select Columns"
            (onChange)="updateColumns()"></p-multiSelect>

            <p-dropdown
            [options]="pageLimitOptions"
            [(ngModel)]="pageLimit"
            placeholder="Page Limit"
            (onChange)="onPageLimitChange($event)"
            styleClass="i2v-dropdown primary-outline medium">
          </p-dropdown>
        </div>

      </i2v-chart-header>
    </div>
    <ng-container *ngIf="isModel && isLoading">
      <div style="
          display: flex;
          width: 360px;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          gap: 20px;
          flex: 1;
          height: 100%;
          width: 100%;
        ">
        <span style="
            width: 50px;
            height: 50px;
            background: url(assets/gifs/horizontal-loader.gif) no-repeat center;
            background-size: 100% 100%;
          "></span>
      </div>
    </ng-container>
    <div *ngIf="isModel && !isLoading && !dataExists" class="data-container" style="
        overflow-x: hidden;
        height: 100%;
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 10px 15px;
      ">
      <div class="noConfExist">
        <div class="logo-container large flex-row-center-center i2v-btn-icon tertiary-default" libSvgElement
          [appSvg]="'assets/Outline/table.svg'" [size]="'48'" [fill-color]="'white'"></div>
        <span class="major-heading">No Data found</span>
      </div>
    </div>
    <div *ngIf="isModel && !isLoading && dataExists && selectedColumnDefs.length == 0" class="data-container" style="
        overflow-x: hidden;
        height: 100%;
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 10px 15px;
      ">
      <div class="noConfExist">
        <div class="logo-container large flex-row-center-center i2v-btn-icon tertiary-default" libSvgElement
          [appSvg]="'assets/Outline/table.svg'" [size]="'48'" [fill-color]="'white'"></div>
        <span class="major-heading">Please select a column</span>
      </div>

    </div>
    <div *ngIf="isModel && !isLoading && dataExists && selectedColumnDefs.length > 0" class="top" style="height: 100%;">
      <app-kendo-grid #Grid [data]="tableData.rows.events" [configuration]="configuration" [cameraNames]="videoSources"
        (columnChanged)="columnChanged($event)"></app-kendo-grid>
    </div>

  </div>
  <div *ngIf="showFilterValues" style="display: flex; padding : 10px; border-top: 1px solid rgb(188, 188, 188)">
    <app-details-widget [commonWidgetCustomFilter]="widgetRequestModel.customFilters">
    </app-details-widget>
  </div>
</div>
