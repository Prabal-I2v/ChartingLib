<div [ngStyle]="{ background:widgetRequestModel?.isWidgetHidden ? 'rgba(0, 0, 0, 0.1)' : '#fff' }" style="display: flex; flex-direction: column; width: 100%; height: 100%">
  <div style="display: flex; flex-direction: column; width: 100%; height: 100%; padding: 16px; overflow-x: auto">
  <div style="
      display: flex;
      justify-items: center;
      align-items: center;
      gap: 10px;
      width: 100%;
    ">
    <div *ngIf="!isModel" class="data-container" style="
        overflow-x: hidden;
        height: 100%;
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 10px 15px;
        background-color: #fff;
      "
    >
      <div class="noConfExist">
        <div class="logo-container large flex-row-center-center i2v-btn-icon tertiary-default"><lib-svg [path]="'assets/Outline/table.svg'" [size]="'48'" [color]="'black'"></lib-svg></div>
        <span class="major-heading">No Configurations found</span>
      </div>
    </div>
    <i2v-chart-header *ngIf="isModel" style="width: 100%; " [(showFilterValues)]="showFilterValues" [widgetModel]="widgetRequestModel"
    [customFilters]="customFilters" [isEditModeOn]="isEditModeOn" (daysFilterOutput)="onTimeChange($event)" (widgetResizeEmittor)="widgetResizeCallback($event)"
    (customFilterOutput)="onCustomFilterValuesChange($event)"
    (refreshIntervalFilterOutput)="onRefreshIntervalChange($event)" (clearCustomFiltersValues)="clearCustomFiltersValues($event)"
    (combineFilterOutputEmittor)="onCombineFilterOutputEmittor($event)" (timePeriodOutput)="onTimeDurationChanged($event)" 
    [applyToAllEnabled]="applyToAllEnabled" [showEntity]="showEntity" [showTimeFilter]="showTimeFilter" [showRefreshInterval]="showRefreshInterval"></i2v-chart-header>
</div>
  <ng-container *ngIf="isModel && isLoading">
    <div style="
        display: flex;
        width: 360px;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 20px;
        flex: 1;
        height: 100%;
        width: 100%;
      ">
      <span style="
          width: 50px;
          height: 50px;
          background: url(assets/gifs/horizontal-loader.gif) no-repeat center;
          background-size: 100% 100%;
        "></span>
    </div>
  </ng-container>
  <div *ngIf="isModel && !isLoading && !dataExists" class="data-container" style="
      overflow-x: hidden;
      height: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px 15px;
      background-color: #fff;
    "
  >
    <div class="noConfExist">
      <div class="logo-container large flex-row-center-center i2v-btn-icon tertiary-default"><lib-svg [path]="'assets/Outline/table.svg'" [size]="'48'" [color]="'black'"></lib-svg></div>
      <span class="major-heading">No Data found</span>
    </div>
  </div>
  <kendo-chart [chartArea]="{ background: 'transparent' }" style="height: 100%" *ngIf="isModel && !isLoading && dataExists" [transitions]="true" [ngStyle]="{'min-height': showFilterValues ? '400px' : '0px'}"
    (legendItemClick)="onLegendItemClick($event)">
    <ng-template kendoChartDonutCenterTemplate>
      <div style="
          font-size: 12px;
          color: #5f6f94;
          display: flex;
          flex-direction: column;
          gap: 0px;
        ">
        <p style="padding: 0px; margin: 0px">
          {{resultLabel}}
        </p>
        <h3 style="padding: 0px; margin: 0px">
          {{resultHeading}}
        </h3>
        <h1 style="padding: 0px; margin: 0px">{{ resultData }}</h1>
      </div>
    </ng-template>

    <kendo-chart-tooltip>
      <ng-template kendoChartSeriesTooltipTemplate let-value="value" let-category="category">
        {{ value }}
      </ng-template>
    </kendo-chart-tooltip>

    <kendo-chart-series>
      <kendo-chart-series-item type="donut" categoryField="name" field="value" [holeSize]="100"
        [data]="chartData.series">
      </kendo-chart-series-item>
    </kendo-chart-series>
    <kendo-chart-legend position="right"></kendo-chart-legend>
  </kendo-chart>
</div>
<div *ngIf="showFilterValues && !isEditModeOn"  style="display: flex; padding : 10px; border-top: 1px solid rgb(188, 188, 188)">
  <app-details-widget [commonWidgetCustomFilter]="widgetRequestModel.customFilters">
  </app-details-widget>
</div>
</div>
