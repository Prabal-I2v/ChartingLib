<div style="display: flex; flex-direction: column; width: 100%; height: 100%; min-height: fit-content; min-width: fit-content;background: white;">
  <div style="display: flex; flex-direction: column; width: 100%; flex: 1; padding: 16px; gap: 10px; overflow-x: auto; min-height: fit-content;">
    <div style=" display: flex; justify-items: center; align-items: center; gap: 10px; width: 100%;">
      <div *ngIf="!isModel" class="data-container" style="
        overflow-x: hidden;
        height: 100%;
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 10px 15px;
        background-color: #fff;
      ">
        <div class="noConfExist">
          <div class="logo-container large flex-row-center-center i2v-btn-icon tertiary-default" libSvgElement
            [appSvg]="'assets/Outline/table.svg'" [size]="'48'" [fill-color]="'white'"></div>
          <span class="major-heading">No Configurations found</span>
        </div>
      </div>
      <i2v-chart-header *ngIf="isModel" style="width: 100%; z-index : 10" [(showFilterValues)]="showFilterValue" (showFilterValuesChange)="ShowFilterChange($event)"
        [widgetModel]="widgetRequestModel" [customFilters]="customFilters" [isEditModeOn]="isEditModeOn"
        (daysFilterOutput)="onTimeChange($event)" (customFilterOutput)="onCustomFilterValuesChange($event)"
        (refreshIntervalFilterOutput)="onRefreshIntervalChange($event)"
        (combineFilterOutputEmittor)="onCombineFilterOutputEmittor($event)" (timePeriodOutput)="onTimeDurationChanged($event)" 
        [applyToAllEnabled]="applyToAllEnabled"></i2v-chart-header>
    </div>
    <ng-container *ngIf="isModel && isLoading">
      <div style="
        display: flex;
        width: 360px;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 20px;
        flex: 1;
        height: 100%;
        width: 100%;
      ">
        <span style="
          width: 50px;
          height: 50px;
          background: url(assets/gifs/horizontal-loader.gif) no-repeat center;
          background-size: 100% 100%;
        "></span>
      </div>
    </ng-container>
    <div *ngIf="isModel && !isLoading && !dataExists" class="data-container" style="
      overflow-x: hidden;
      height: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px 15px;
      background-color: #fff;
    ">
      <div class="noConfExist">
        <div class="logo-container large flex-row-center-center i2v-btn-icon tertiary-default" libSvgElement
          [appSvg]="'assets/Outline/table.svg'" [size]="'48'" [fill-color]="'white'"></div>
        <span class="major-heading">No Data found</span>
      </div>
    </div>
    <div *ngIf="isModel && !isLoading && dataExists" class="top">
      <div class="data-box">
        <div *ngIf="svgIcon" class="icon-box">
          <div libSvgElement [appSvg]="svgIcon" [size]="'20'" [fill-color]="'#5F6F94'"></div>
        </div>

        <div style="display: flex; flex-direction: row; gap: 14px; justify-content: center; align-items: flex-start;">
          <div class="number-grp">
            <div class="minorheader" [style.--minor-header-color]="ResSvgIconColor" style="font-style: italic;"
              *ngIf="PropName">{{ PropName | uppercase}}</div>
            <div class="digits" *ngIf="chartData && chartData.series">
              {{ PropValue }}
            </div>
          </div>
          <div *ngIf="widgetRequestModel.findResultSvgIcon" libSvgElement [appSvg]="ResSvgIcon"
            [fill-color]="ResSvgIconColor" [size]="'60'"></div>
          <img style="height: 60px; width: 60px; border-radius: 20px;" *ngIf="propImage" [src]="propImage" (click)="showDetail()">
        </div>
      </div>

      <kendo-sparkline *ngIf="showChart && chartData && chartData.series" class="sparkline"
        [data]="chartData.series[0].data" [type]="'line'" [tooltip]="{ visible: false }" [seriesDefaults]="{
          line: {
            color: 'green',
            width: 2,
            style: 'smooth',
          },
        }">
      </kendo-sparkline>
    </div>
    <div *ngIf="
        isModel &&
        !isLoading &&
        dataExists &&
        widgetRequestModel.clubbingTime &&
        (widgetRequestModel.groupBy1?.isTime ||
          widgetRequestModel.groupBy2?.isTime)
      " class="bottom">
      {{ percentValue | number: ".1-2" }}%
      {{ percentValue == 0 ? "rise" : "" }}
      <svg *ngIf="percentValue > 0 || percentValue < 0" width="20" height="20" viewBox="0 0 20 20" fill="none"
        xmlns="http://www.w3.org/2000/svg">
        <path *ngIf="percentValue > 0" fill-rule="evenodd" clip-rule="evenodd"
          d="M12 7C11.4477 7 11 6.55228 11 6C11 5.44772 11.4477 5 12 5H17C17.5523 5 18 5.44772 18 6V11C18 11.5523 17.5523 12 17 12C16.4477 12 16 11.5523 16 11V8.41421L11.7071 12.7071C11.3166 13.0976 10.6834 13.0976 10.2929 12.7071L8 10.4142L3.70711 14.7071C3.31658 15.0976 2.68342 15.0976 2.29289 14.7071C1.90237 14.3166 1.90237 13.6834 2.29289 13.2929L7.29289 8.29289C7.68342 7.90237 8.31658 7.90237 8.70711 8.29289L11 10.5858L14.5858 7H12Z"
          fill="green" />
        <path *ngIf="percentValue < 0" fill-rule="evenodd" clip-rule="evenodd"
          d="M12 7C11.4477 7 11 6.55228 11 6C11 5.44772 11.4477 5 12 5H17C17.5523 5 18 5.44772 18 6V11C18 11.5523 17.5523 12 17 12C16.4477 12 16 11.5523 16 11V8.41421L11.7071 12.7071C11.3166 13.0976 10.6834 13.0976 10.2929 12.7071L8 10.4142L3.70711 14.7071C3.31658 15.0976 2.68342 15.0976 2.29289 14.7071C1.90237 14.3166 1.90237 13.6834 2.29289 13.2929L7.29289 8.29289C7.68342 7.90237 8.31658 7.90237 8.70711 8.29289L11 10.5858L14.5858 7H12Z"
          fill="red" />
      </svg>
      in last
      {{
      widgetRequestModel.groupBy1?.isTime
      ? widgetRequestModel.groupBy1.mainColumn
      : widgetRequestModel.groupBy2.mainColumn
      }}
    </div>
  </div>
  <div *ngIf="showFilterValue" style="display: flex; padding : 10px; border-top: 1px solid rgb(188, 188, 188)">
    <app-details-widget [commonWidgetCustomFilter]="widgetRequestModel.customFilters">
    </app-details-widget>
  </div>
</div>
