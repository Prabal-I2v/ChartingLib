<div style="display: flex; flex-direction: column; width: 100%; height: 100%">
  <div style="display: flex; flex-direction: column; width: 100%; height: 100%; padding: 16px; overflow-x: auto">
    <div style="
      display: flex;
      justify-items: center;
      align-items: center;
      gap: 10px;
      width: 100%;
    ">
      <div *ngIf="!isModel" class="data-container" style="
        overflow-x: hidden;
        height: 100%;
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 10px 15px;
        background-color: #fff;
      ">
        <div class="noConfExist">
          <div class="logo-container large flex-row-center-center i2v-btn-icon tertiary-default" libSvgElement
            [appSvg]="'assets/Outline/table.svg'" [size]="'48'" [fill-color]="'white'"></div>
          <span class="major-heading">No Configurations found</span>
        </div>
      </div>
      <i2v-chart-header *ngIf="isModel" style="width: 100%; z-index : 10" [(showFilterValues)]="showFilterValues"
        [widgetModel]="widgetRequestModel" [customFilters]="customFilters" [isEditModeOn]="isEditModeOn"
        (daysFilterOutput)="onTimeChange($event)" (customFilterOutput)="onCustomFilterValuesChange($event)"
        (refreshIntervalFilterOutput)="onRefreshIntervalChange($event)"
        (combineFilterOutputEmittor)="onCombineFilterOutputEmittor($event)" (timePeriodOutput)="onTimeDurationChanged($event)" 
        [applyToAllEnabled]="applyToAllEnabled"></i2v-chart-header>

    </div>
    <ng-container *ngIf="isModel && isLoading">
      <div style="
        display: flex;
        width: 360px;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 20px;
        flex: 1;
        height: 100%;
        width: 100%;
      ">
        <span style="
          width: 50px;
          height: 50px;
          background: url(assets/gifs/horizontal-loader.gif) no-repeat center;
          background-size: 100% 100%;
        "></span>
      </div>
    </ng-container>
    <div *ngIf="isModel && !isLoading && !dataExists" class="data-container" style="
      overflow-x: hidden;
      height: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px 15px;
      background-color: #fff;
    ">
      <div class="noConfExist">
        <div class="logo-container large flex-row-center-center i2v-btn-icon tertiary-default" libSvgElement
          [appSvg]="'assets/Outline/table.svg'" [size]="'48'" [fill-color]="'white'"></div>
        <span class="major-heading">No Data found</span>
      </div>
    </div>
    <kendo-chart style="height: 100%" *ngIf="isModel && !isLoading && dataExists" [ngStyle]="{'min-height': showFilterValues ? '400px' : '0px'}"
      [pannable]="widgetRequestModel.isPannable ? { lock: 'y' } : false" [zoomable]="
      widgetRequestModel.isZoomable ? { mousewheel: { lock: 'y' } } : false
    ">
      <kendo-chart-title text="Heat Map" [margin]="{ left: 40 }"></kendo-chart-title>
      <kendo-chart-tooltip>
        <ng-template kendoChartSeriesTooltipTemplate let-value="value.value" let-category="category">
          {{ value }}
        </ng-template>
      </kendo-chart-tooltip>
      <kendo-chart-legend position="top" orientation="horizontal" background="#f4f5f8" [spacing]="140"
        [padding]="{ left: 80, right: 80 }"></kendo-chart-legend>
      <kendo-chart-series>
        <kendo-chart-series-item type="heatmap" color="#216e39" [data]="chartData.series" [labels]="{ visible: false }"
          [markers]="{ type: 'roundedRect', border: { width: 2 } }" xField="name" yField="yaxis" valueField="value">
        </kendo-chart-series-item>
      </kendo-chart-series>

      <kendo-chart-x-axis>
        <kendo-chart-x-axis-item [visible]="true"> </kendo-chart-x-axis-item>
      </kendo-chart-x-axis>

      <kendo-chart-y-axis>
        <kendo-chart-y-axis-item [reverse]="true" [line]="{ visible: false }">
          <!-- [labels]="{ content: yAxisLabelContent }"> -->
        </kendo-chart-y-axis-item>
      </kendo-chart-y-axis>
    </kendo-chart>
  </div>
  <div *ngIf="showFilterValues" style="display: flex; padding : 10px; border-top: 1px solid rgb(188, 188, 188)">
    <app-details-widget [commonWidgetCustomFilter]="widgetRequestModel.customFilters">
    </app-details-widget>
  </div>
</div>
