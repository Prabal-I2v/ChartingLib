<div [ngStyle]="{ background:widgetRequestModel?.WidgetInteractivityConfig.isWidgetHidden ? 'rgba(0, 0, 0, 0.1)' : '#fff' }" style="display: flex; flex-direction: column; width: 100%; height: 100%; background: white;">
  <div style="display: flex; flex-direction: column; width: 100%; height: 100%; padding: 16px; overflow-x: auto">
    <div style="
      display: flex;
      justify-items: center;
      align-items: center;
      gap: 10px;
      width: 100%;
    ">
      <div *ngIf="!isModel" class="data-container" style="
        overflow-x: hidden;
        height: 100%;
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 10px 15px;
        background-color: #fff;
      ">
        <div class="noConfExist">
          <div class="logo-container large flex-row-center-center i2v-btn-icon tertiary-default" libSvgElement
            [appSvg]="'assets/Outline/table.svg'" [size]="'48'" [fill-color]="'white'"></div>
          <span class="major-heading">No Configurations found</span>
        </div>
      </div>
      <i2v-chart-header *ngIf="isModel" style="width: 100%;" [(showFilterValues)]="showFilterValues" (widgetResizeEmittor)="widgetResizeCallback($event)"
        [widgetModel]="widgetRequestModel" [customFilters]="customFilters" [isEditModeOn]="isEditModeOn"
        (daysFilterOutput)="onTimeChange($event)" (customFilterOutput)="onCustomFilterValuesChange($event)"
        (refreshIntervalFilterOutput)="onRefreshIntervalChange($event)" (clearCustomFiltersValues)="clearCustomFiltersValues($event)"
        (combineFilterOutputEmittor)="onCombineFilterOutputEmittor($event)" (timePeriodOutput)="onTimeDurationChanged($event)" 
        [applyToAllEnabled]="applyToAllEnabled" [showEntity]="showEntity" [showTimeFilter]="showTimeFilter" [showRefreshInterval]="showRefreshInterval"></i2v-chart-header>
    </div>
    <ng-container *ngIf="isModel && isLoading">
      <div style="
        display: flex;
        width: 360px;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 20px;
        flex: 1;
        height: 100%;
        width: 100%;
      ">
        <span style="
          width: 50px;
          height: 50px;
          background: url(assets/gifs/horizontal-loader.gif) no-repeat center;
          background-size: 100% 100%;
        "></span>
      </div>
    </ng-container>
    <div *ngIf="isModel && !isLoading && !dataExists" class="data-container" style="
      overflow-x: hidden;
      height: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px 15px;
    ">
      <div class="noConfExist">
        <div class="logo-container large flex-row-center-center i2v-btn-icon tertiary-default" libSvgElement
          [appSvg]="'assets/Outline/table.svg'" [size]="'48'" [fill-color]="'white'"></div>
        <span class="major-heading">No Data found</span>
      </div>
    </div>
    <kendo-chart [chartArea]="{ background: 'transparent' }" style="height: 100%" *ngIf="isModel && !isLoading && dataExists" [ngStyle]="{'min-height': showFilterValues ? '400px' : '0px'}"
      [pannable]="widgetRequestModel.WidgetInteractivityConfig.isPannable ? { lock: 'y' } : false" [zoomable]="
      widgetRequestModel.WidgetInteractivityConfig.isZoomable ? { mousewheel: { lock: 'y' } } : false
    ">
      <kendo-chart-category-axis>
        <kendo-chart-category-axis-item [max]="widgetRequestModel.WidgetInteractivityConfig.max" [categories]="chartData.chartCategories"
          [title]="{ text: chartData.x_label }">
          <kendo-chart-category-axis-item-labels [rotation]="'auto'">
          </kendo-chart-category-axis-item-labels>
        </kendo-chart-category-axis-item>
      </kendo-chart-category-axis>
      <kendo-chart-tooltip>
        <ng-template kendoChartSeriesTooltipTemplate let-value="value" let-category="category">
          {{ value }}
        </ng-template>
      </kendo-chart-tooltip>
      <kendo-chart-legend style="display: none" position="top" orientation="horizontal" [spacing]="140"
        [padding]="{ left: 80, right: 80 }"></kendo-chart-legend>
      <kendo-chart-series>
        <kendo-chart-series-item type="column" *ngFor="let data of chartData.series" [gap]="2" [spacing]="0.25"
          [data]="data.data" [color]="data.color" [name]="data.name">
        </kendo-chart-series-item>
      </kendo-chart-series>
    </kendo-chart>
  </div>
  <div *ngIf="showFilterValues && !isEditModeOn" style="display: flex; padding : 10px; border-top: 1px solid rgb(188, 188, 188)">
    <app-details-widget [commonWidgetCustomFilter]="widgetRequestModel.filterConfig.customFilters">
    </app-details-widget>
  </div>
</div>
